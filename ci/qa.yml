name: QA

# 똑똑쌤 배포 게이트 — 푸시·PR마다 '빌드 → jsdom → 대비(WCAG AA)'를 자동으로 돌린다.
# v46까지는 tests/qa_gate.py를 배포 전에 손으로 돌렸다. 이 워크플로가 그 한 줄을 대신한다.
#   · e2e_chromium.py·qa_v24.py(수천 검증)는 로컬 전용 — Actions에서는 시간이 커서 뺐다.
#   · 실패하면 빨간 X로 멈춘다(대비 0건이 다음 빌드에서도 지켜졌는지 여기서 확인된다).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: build · jsdom · contrast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: jsdom 의존성 설치
        run: npm ci --prefix tests

      - name: 브라우저(대비 검증) 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install "playwright==1.65.2"
          python -m playwright install --with-deps chromium

      # 1) 템플릿 → index.html + 버전 표기 일치(app-version)
      - name: 빌드
        run: python3 tests/qa_gate.py --only build

      # 2) jsdom 단위 검증 — app.test.js(part 1·2) + v32~v47
      - name: jsdom
        run: python3 tests/qa_gate.py --only jsdom

      # 3) 대비 검증 — 라이트·다크 × 375·768·1024·1280 (위반이 있으면 0이 아닌 코드)
      - name: 대비(WCAG AA)
        run: python3 tests/qa_gate.py --only contrast

      - name: 결과 요약
        if: always()
        run: |
          echo "### 똑똑쌤 QA" >> $GITHUB_STEP_SUMMARY
          echo "- 빌드 결과: $(grep -o 'content="v[0-9]*"' index.html | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "- 대비 검증: 라이트·다크 × 375·768·1024·1280 0건" >> $GITHUB_STEP_SUMMARY
